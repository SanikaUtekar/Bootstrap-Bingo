<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Offer Boxes with JS Hover</title>
    <link rel="stylesheet" href="./form.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>

    </style>
</head>

<body>

    <div class="container mt-5" style="max-width: 600px;">
        <form>
            <!-- Offer Box Template -->
            <div class="offer-box" id="offer1">
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="unitOption" id="option1" value="10" checked>
                    <label class="form-check-label" for="option1" style="display: flex;
                    justify-content: space-between; align-items: center;">
                        <div>
                            <strong>1 Pair</strong>
                            <div>DKK 195.00</div>
                        </div>

                        <div>
                            <span class="discount-badge">50% Off</span>
                        </div>
                    </label>
                </div>

                <!-- Size & Color (only in this box) -->
                <div class="size-color-fields">
                    <div class="row">
                        <div class="col-md-6">
                            <label for="size1" class="form-label">Size</label>
                            <select id="size1" class="form-select">
                                <option>S</option>
                                <option>M</option>
                                <option>L</option>
                                <option>XL</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="color1" class="form-label">Colour</label>
                            <select id="color1" class="form-select">
                                <option>Black</option>
                                <option>White</option>
                                <option>Blue</option>
                            </select>
                        </div>
                        <div class="col-md-6 mt-2">
                            <select id="size2" class="form-select">
                                <option>S</option>
                                <option>M</option>
                                <option>L</option>
                                <option>XL</option>
                            </select>
                        </div>
                        <div class="col-md-6 mt-2">
                            <select id="color2" class="form-select">
                                <option>Colour</option>
                                <option>Black</option>
                                <option>White</option>
                                <option>Red</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <div class="offer-box" id="offer2">
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="unitOption" id="option2" value="18">
                    <label class="form-check-label" for="option2" style="display: flex;
                    justify-content: space-between; align-items: center;">
                        <div>
                            <strong>2 Pair</strong>
                            <div>DKK 345.00</div>
                        </div>

                        <div>
                            <span class="discount-badge">40% Off</span>
                        </div>
                    </label>
                </div>

                <!-- Size & Color (only in this box) -->
                <div class="size-color-fields">
                    <div class="row">
                        <div class="col-md-6">
                            <label for="size1" class="form-label">Size </label>
                            <select id="size1" class="form-select">
                                <option>S</option>
                                <option>M</option>
                                <option>L</option>
                                <option>XL</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="color1" class="form-label">Colour</label>
                            <select id="color1" class="form-select">
                                <option>Black</option>
                                <option>White</option>
                                <option>Blue</option>
                            </select>
                        </div>
                        <div class="col-md-6 mt-2">
                            <select id="size2" class="form-select">
                                <option>S</option>
                                <option>M</option>
                                <option>L</option>
                                <option>XL</option>
                            </select>
                        </div>
                        <div class="col-md-6 mt-2">
                            <select id="color2" class="form-select">
                                <option>Colour</option>
                                <option>Black</option>
                                <option>White</option>
                                <option>Red</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <div class="offer-box" id="offer3">
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="unitOption" id="option3" value="24">
                    <label class="form-check-label" for="option3" style="display: flex;
                justify-content: space-between; align-items: center;">
                        <div>
                            <strong>3 Pair</strong>
                            <div>DKK 528.00</div>
                        </div>
                        <div>
                            <span class="discount-badge">60% Off</span>
                        </div>
                    </label>
                </div>

                <!-- Size & Color (only in this box) -->
                <div class="size-color-fields">
                    <div class="row">
                        <div class="col-md-6">
                            <label for="size1" class="form-label">Size</label>
                            <select id="size1" class="form-select">
                                <option>S</option>
                                <option>M</option>
                                <option>L</option>
                                <option>XL</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="color1" class="form-label">Colour</label>
                            <select id="color1" class="form-select">
                                <option>Black</option>
                                <option>White</option>
                                <option>Blue</option>
                            </select>
                        </div>
                        <div class="col-md-6 mt-2">
                            <select id="size2" class="form-select">
                                <option>S</option>
                                <option>M</option>
                                <option>L</option>
                                <option>XL</option>
                            </select>
                        </div>
                        <div class="col-md-6 mt-2">
                            <select id="color2" class="form-select">
                                <option>Colour</option>
                                <option>Black</option>
                                <option>White</option>
                                <option>Red</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <div style="display: flex ; justify-content: space-between;">
                <div class="text-success mb-1">Free 2 Day Shipping</div>
                <div class="total-section" id="totalPrice">Total: <span style="font-weight: 700;">DKK 360.00</span></div>
            </div>

            <button type="submit" class="btn btn-cart mt-3">+ Add to Cart</button>
            <p class="text-muted mt-2 text-end"><small>@ Powered by Pumper</small></p>
        </form>
    </div>

    <script>
        const offerBoxes = document.querySelectorAll('.offer-box');

        offerBoxes.forEach(box => {
            box.addEventListener('mouseenter', () => {
                box.classList.add('hovered');
            });

            box.addEventListener('mouseleave', () => {
                box.classList.remove('hovered');
            });
        });
    </script>

</body>

</html>
