<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Offer Boxes with JS Hover</title>
    <link rel="stylesheet" href="./form.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>

    </style>
</head>

<body>

<div class="container mt-5"  style="max-width: 600px;">
    <form>
        <!-- Offer Box Template -->
        <div class="offer-box" id="offer1">
            <div class="form-check">
                <input class="form-check-input" type="radio" name="unitOption" id="option1" value="10" checked >
                <label class="form-check-label" for="option1">
                    <strong>1 Unit</strong> <span class="discount-badge">10% Off</span>
                    <div>$10.00 USD <del class="text-muted">$24.00 USD</del></div>
                </label>
            </div>

            <!-- Size & Color (only in this box) -->
            <div class="size-color-fields">
                <div class="row">
                    <div class="col-md-6">
                        <label for="size1" class="form-label">Size #1</label>
                        <select id="size1" class="form-select">
                            <option>S</option>
                            <option>M</option>
                            <option>L</option>
                            <option>XL</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="color1" class="form-label">Colour</label>
                        <select id="color1" class="form-select">
                            <option>Black</option>
                            <option>White</option>
                            <option>Blue</option>
                        </select>
                    </div>
                    <div class="col-md-6 mt-2">
                        <label for="size2" class="form-label">Size #2</label>
                        <select id="size2" class="form-select">
                            <option>S</option>
                            <option>M</option>
                            <option>L</option>
                            <option>XL</option>
                        </select>
                    </div>
                    <div class="col-md-6 mt-2">
                        <label for="color2" class="form-label">Colour</label>
                        <select id="color2" class="form-select">
                            <option>Colour</option>
                            <option>Black</option>
                            <option>White</option>
                            <option>Red</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <div class="offer-box" id="offer2">
            <div class="form-check">
                <input class="form-check-input" type="radio" name="unitOption" id="option2" value="18">
                <label class="form-check-label" for="option2">
                    <strong>2 Units</strong> <span class="discount-badge">20% Off</span>
                    <div>$18.00 USD <del class="text-muted">$30.00 USD</del></div>
                </label>
            </div>

            <!-- Size & Color (only in this box) -->
            <div class="size-color-fields">
                <div class="row">
                    <div class="col-md-6">
                        <label for="size1" class="form-label">Size #1</label>
                        <select id="size1" class="form-select">
                            <option>S</option>
                            <option>M</option>
                            <option>L</option>
                            <option>XL</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="color1" class="form-label">Colour</label>
                        <select id="color1" class="form-select">
                            <option>Black</option>
                            <option>White</option>
                            <option>Blue</option>
                        </select>
                    </div>
                    <div class="col-md-6 mt-2">
                        <label for="size2" class="form-label">Size #2</label>
                        <select id="size2" class="form-select">
                            <option>S</option>
                            <option>M</option>
                            <option>L</option>
                            <option>XL</option>
                        </select>
                    </div>
                    <div class="col-md-6 mt-2">
                        <label for="color2" class="form-label">Colour</label>
                        <select id="color2" class="form-select">
                            <option>Colour</option>
                            <option>Black</option>
                            <option>White</option>
                            <option>Red</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <div class="offer-box" id="offer3">
            <div class="form-check">
                <input class="form-check-input" type="radio" name="unitOption" id="option3" value="24">
                <label class="form-check-label" for="option3">
                    <strong>3 Units</strong> <span class="discount-badge">30% Off</span>
                    <div>$24.00 USD <del class="text-muted">$36.00 USD</del></div>
                </label>
            </div>

            <!-- Size & Color (only in this box) -->
            <div class="size-color-fields">
                <div class="row">
                    <div class="col-md-6">
                        <label for="size1" class="form-label">Size #1</label>
                        <select id="size1" class="form-select">
                            <option>S</option>
                            <option>M</option>
                            <option>L</option>
                            <option>XL</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="color1" class="form-label">Colour</label>
                        <select id="color1" class="form-select">
                            <option>Black</option>
                            <option>White</option>
                            <option>Blue</option>
                        </select>
                    </div>
                    <div class="col-md-6 mt-2">
                        <label for="size2" class="form-label">Size #2</label>
                        <select id="size2" class="form-select">
                            <option>S</option>
                            <option>M</option>
                            <option>L</option>
                            <option>XL</option>
                        </select>
                    </div>
                    <div class="col-md-6 mt-2">
                        <label for="color2" class="form-label">Colour</label>
                        <select id="color2" class="form-select">
                            <option>Colour</option>
                            <option>Black</option>
                            <option>White</option>
                            <option>Red</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <div style="display: flex ; justify-content: space-between;">
            <div class="text-danger mb-1">Free Delivery</div>
        <div class="total-section" id="totalPrice">Total: $10.00 USD</div>
        </div>
    
        <button type="submit" class="btn btn-cart mt-3">+ Add to Cart</button>
        <p class="text-muted mt-2 text-end"><small>@ Powered by Pumper</small></p>
    </form>
</div>

    <script>
        const offerBoxes = document.querySelectorAll('.offer-box');

        offerBoxes.forEach(box => {
            box.addEventListener('mouseenter', () => {
                box.classList.add('hovered');
            });

            box.addEventListener('mouseleave', () => {
                box.classList.remove('hovered');
            });
        });
    </script>

</body>

</html>
